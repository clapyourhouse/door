<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEMENT 代々木店 ポスティングマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  #header { background: #1A1A2E; color: white; padding: 12px 20px; font-size: 16px; font-weight: bold; }
  #note { background: #FFFF00; padding: 8px 20px; font-size: 12px; }
  #map { height: calc(100vh - 72px); }
  .loading { text-align:center; padding: 40px; color: #666; }
</style>
</head>
<body>
<div id="header">ELEMENT 代々木店 ／ ポスティングマップ</div>
<div id="note" id="status">📍 地図を読み込み中...</div>
<div id="map"></div>
<script>
const buildings = [
  { name: "MARUSH YOYOGI",            query: "マルシュ代々木 渋谷区代々木2丁目 東京" },
  { name: "PALACE STUDIO 代々木",     query: "パレステュディオ代々木 渋谷区代々木2-20-13 東京" },
  { name: "藤和シティホームズ 代々木二丁目", query: "藤和シティホームズ代々木二丁目 渋谷区 東京" },
  { name: "J・PARK YOYOGI",           query: "J-PARK代々木 ジェイパーク代々木 渋谷区 東京" },
  { name: "Kirika",                   query: "キリカ Kirika 渋谷区代々木2-19-3 東京" },
  { name: "RESIA リージア代々木",      query: "リージア代々木 渋谷区代々木2-18-9 東京" },
  { name: "Mio Castello YOYOGI",      query: "ミオカステーロ代々木 渋谷区代々木2丁目 東京" },
  { name: "Vingt et un II",           query: "Vingt et un 代々木 渋谷区代々木2丁目 東京" },
];

const map = L.map('map').setView([35.6853, 139.6993], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

const statusEl = document.getElementById('note');
let loaded = 0;

async function geocodeAndPin(b) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(b.query)}&format=json&limit=1&accept-language=ja`;
  try {
    const res = await fetch(url, { headers: { 'User-Agent': 'PosstingMap/1.0' } });
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.query)}`;
      L.marker([lat, lon]).addTo(map)
        .bindPopup(`<b>${b.name}</b><br><a href="${mapsUrl}" target="_blank">Google Mapsで開く →</a>`);
    }
  } catch(e) {
    console.warn('Geocode failed for', b.name, e);
  }
  loaded++;
  statusEl.textContent = loaded < buildings.length
    ? `📍 位置情報を取得中... (${loaded}/${buildings.length})`
    : `✅ 全${buildings.length}棟の読み込み完了。ピンをクリックするとGoogle Mapsで開きます。`;
}

(async () => {
  for (const b of buildings) {
    await geocodeAndPin(b);
    await new Promise(r => setTimeout(r, 500)); // Nominatim rate limit
  }
})();
</script>
</body>
</html>
