<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0a0f;
  color: #fff;
  height: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  overflow-y: hidden;
  overscroll-behavior: none;
}

/* ======= SCREENS ======= */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
.screen.hidden { opacity: 0; pointer-events: none; }
.screen.gone { display: none; }

/* ======= LANDING ======= */
#s-landing { background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%); z-index: 100; }

.logo { font-size: 13px; letter-spacing: 8px; text-transform: uppercase; color: #666; margin-bottom: 56px; }

.door-wrap { perspective: 1200px; cursor: pointer; margin-bottom: 44px; }
.door-outer {
  width: 160px; height: 260px;
  border: 2px solid #444;
  border-radius: 80px 80px 0 0;
  position: relative;
  transform-style: preserve-3d;
}
.door-panel {
  position: absolute; inset: 0;
  border-radius: 78px 78px 0 0;
  background: linear-gradient(160deg, #2a2a3e 0%, #1a1a28 100%);
  transform-origin: left center;
  transition: transform 1.2s cubic-bezier(0.4,0,0.2,1);
  border-right: 1px solid #555;
}
.door-panel.open { transform: rotateY(-75deg); }
.door-panel::before {
  content: '';
  position: absolute;
  left: 18px; right: 18px; top: 36px; bottom: 36px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 54px 54px 4px 4px;
}
.door-knob {
  position: absolute; right: 20px; top: 50%;
  width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e0c87a, #9a7a2a);
  box-shadow: 0 0 8px rgba(200,160,60,0.5);
}
.door-glow {
  position: absolute; inset: 0;
  border-radius: 78px 78px 0 0;
  background: radial-gradient(ellipse at center, rgba(100,180,255,0.12) 0%, transparent 70%);
  opacity: 0; transition: opacity 1.2s ease;
}
.door-glow.show { opacity: 1; }

/* 扉を開く演出：扉が開く → 先へ進む → 扉の穴が広がる → 読み込み済みの映像が全面に見える */
#s-landing { overflow: hidden; }
#s-landing.entering { background: transparent; }
#s-landing.entering .logo, #s-landing.entering [data-i18n="tagline"], #s-landing.entering .open-btn, #s-landing.entering .legal-links { opacity: 0; transition: opacity 0.25s ease; }
#s-landing[data-anim="portal"].entering .door-outer::before {
  content: ''; position: absolute; inset: -2px; border-radius: 82px 82px 0 0;
  box-shadow: 0 0 0 150vmax #10101c; transform: translateZ(-2px); pointer-events: none;
}
#s-landing[data-anim="portal"] .door-wrap.zoom { transform: scale(20); transform-origin: 50% 62%; transition: transform 2s cubic-bezier(0.5, 0, 0.3, 1) 0.7s; }
#s-landing.fadeout { opacity: 0; transition: opacity 1.5s ease-in-out; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .door-wrap.zoom { transform: none; transition: none; } }


/* 版A＋光：扉が広がる途中で、扉の奥から、淡い光がふくらみ、引いていく */
#s-landing[data-anim="portal"]::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
  background: radial-gradient(circle at var(--cx) var(--cy), rgba(220,235,255,0.95) 0%, rgba(160,200,255,0.5) 28%, rgba(160,200,255,0) 62%);
  animation: portalBloom 2.4s ease-in-out 0.3s both;
}
@keyframes portalBloom { 0% { opacity: 0; } 38% { opacity: 0.6; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #s-landing[data-anim="portal"]::after { animation: none; } }

/* 版B：扉はそのまま。扉の奥から光が広がり、周りに街の映像が現れる（?anim=light） */
@property --r { syntax: '<length>'; inherits: true; initial-value: 0px; }
#s-landing[data-anim="light"] .door-wrap { position: relative; z-index: 2; }
#s-landing[data-anim="light"]::before, #s-landing[data-anim="light"]::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#s-landing[data-anim="light"].entering::before {
  opacity: 1; background: #10101c; z-index: 1;
  -webkit-mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--r) - 22vmax), #000 var(--r));
          mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--r) - 22vmax), #000 var(--r));
}
#s-landing[data-anim="light"].entering::after {
  z-index: 1; background: radial-gradient(circle at var(--cx) var(--cy), rgba(215,232,255,0.95) 0%, rgba(160,200,255,0.55) 35%, rgba(160,200,255,0) 70%);
  -webkit-mask-image: radial-gradient(circle at var(--cx) var(--cy), #000 calc(var(--r) * 0.55), transparent calc(var(--r) * 0.9));
          mask-image: radial-gradient(circle at var(--cx) var(--cy), #000 calc(var(--r) * 0.55), transparent calc(var(--r) * 0.9));
  animation: lightBloom 2.6s ease-in-out 0.45s both;
}
#s-landing[data-anim="light"].spread { --r: 175vmax; transition: --r 2.6s cubic-bezier(0.45, 0, 0.25, 1) 0.45s; }
@keyframes lightBloom { 0% { opacity: 0; } 30% { opacity: 0.9; } 100% { opacity: 0; } }


/* 着地の演出：ピントが合う → 地名が浮かぶ → 画面の部品が、あとから入る */
.arrival { position: absolute; top: 0; left: 0; bottom: 0; right: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 4; pointer-events: none; opacity: 0; text-align: center; color: #fff; padding: 0 24px; }
/* 明るい街でも読めるように、文字の後ろに、薄い暗い膜を敷く */
.arrival::before { content: ''; position: absolute; left: 50%; top: 50%; width: min(92%, 760px); height: 280px; transform: translate(-50%, -50%); z-index: -1;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.36) 0%, rgba(0,0,0,0.18) 42%, rgba(0,0,0,0) 78%); filter: blur(14px); }
.arrival-name { font-size: clamp(30px, 6.5vw, 68px); font-weight: 400; letter-spacing: 0.14em; text-shadow: 0 1px 2px rgba(0,0,0,0.65), 0 2px 14px rgba(0,0,0,0.6), 0 0 36px rgba(0,0,0,0.4); }
.arrival-sub { font-size: 13px; font-weight: 500; letter-spacing: 0.5em; opacity: 0.95; text-shadow: 0 1px 2px rgba(0,0,0,0.6), 0 1px 10px rgba(0,0,0,0.5); }
.arrival.show { animation: arrivalName 3.4s ease both; }
@keyframes arrivalName { 0% { opacity: 0; transform: translateY(12px); } 22% { opacity: 1; transform: none; } 68% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
#sv-iframe.focus-pull { animation: focusPull var(--fp, 1.4s) cubic-bezier(0.2, 0.6, 0.2, 1) backwards; }
@keyframes focusPull { from { filter: blur(14px) saturate(1.25); transform: scale(1.12); } to { filter: blur(0) saturate(1); transform: none; } }
.chat-panel.arrive-in, .sv-overlay.arrive-in { animation: hudIn 0.9s ease var(--hd, 1.2s) backwards; }
@keyframes hudIn { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 640px) { .arrival { right: 0; bottom: calc(38dvh + 8px); } }
@media (prefers-reduced-motion: reduce) { .arrival.show, #sv-iframe.focus-pull, .chat-panel.arrive-in, .sv-overlay.arrive-in { animation: none; } }

.open-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #aaa; padding: 13px 38px;
  border-radius: 40px; font-size: 13px;
  letter-spacing: 3px; cursor: pointer;
  transition: all 0.3s; text-transform: uppercase;
}
.open-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
.legal-links { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; padding: 0 12px; font-size: 11px; }
.legal-links a, .survey-legal a { color: #7a86b0; text-decoration: none; }
.legal-links a:hover, .survey-legal a:hover { text-decoration: underline; }
.sv-email.hidden { display: none; }
.survey-legal { margin: 10px 0 0; font-size: 11px; color: #888; line-height: 1.7; }

.host-link {
  position: absolute; bottom: 36px;
  font-size: 12px; color: #444; cursor: pointer;
  letter-spacing: 1px; text-decoration: none;
  transition: color 0.2s;
}
.host-link:hover { color: #888; }
.host-link span { color: #667eea; }

/* ======= AREA SELECT ======= */
#s-area {
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
  z-index: 99;
  gap: 0;
}

.area-title { font-size: 13px; letter-spacing: 6px; color: #555; text-transform: uppercase; margin-bottom: 10px; }
.area-sub { font-size: 14px; color: #888; margin-bottom: 48px; }

.area-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 560px;
  width: 90%;
  margin-bottom: 32px;
}

.area-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 20px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}
.area-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
.area-card.selected { border-color: #667eea; background: rgba(102,126,234,0.12); }
.area-card.locked { opacity: 0.5; cursor: default; }
.area-card .emoji { font-size: 28px; margin-bottom: 10px; }
.area-card .label { font-size: 12px; color: #bbb; }
.area-card .sublabel { font-size: 10px; color: #555; margin-top: 4px; }

.lock-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 10px; background: rgba(102,126,234,0.2);
  color: #667eea; border-radius: 4px; padding: 2px 6px;
  letter-spacing: 1px;
}

.area-cta {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none; color: #fff;
  padding: 14px 48px; border-radius: 40px;
  font-size: 14px; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
  text-transform: uppercase;
}
.area-cta:hover { box-shadow: 0 0 24px rgba(102,126,234,0.5); transform: translateY(-1px); }

/* ======= MAIN APP ======= */
#s-app { display: none; flex-direction: column; z-index: 10; }
#s-app.visible { display: flex; }

.topbar {
  height: 52px;
  background: rgba(10,10,15,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center;
  padding: 0 20px; gap: 14px;
  flex-shrink: 0; position: relative; z-index: 20;
}
.topbar-logo { font-size: 12px; letter-spacing: 5px; color: #555; text-transform: uppercase; }
.location-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 5px 14px;
  font-size: 13px; color: #ccc;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 6px #4ade80;
  animation: pulse 2s infinite; margin-left: auto;
}
.timer-badge {
  font-size: 12px; font-family: monospace;
  color: #aaa; letter-spacing: 1px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 5px 14px;
  transition: color 0.3s, border-color 0.3s;
}
.timer-badge.warn { color: #f87171; border-color: rgba(248,113,113,0.4); }

.session-end-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.session-end-card {
  background: #13131f;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 40px;
  text-align: center; max-width: 360px; width: 90%;
}
.session-end-card h2 { font-size: 22px; margin-bottom: 10px; }
.session-end-card p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.6; }
.session-end-btns { display: flex; flex-direction: column; gap: 10px; }
.btn-premium {
  padding: 14px; border-radius: 12px;
  background: linear-gradient(135deg,#667eea,#764ba2);
  border: none; color: #fff; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: all 0.3s;
}
.btn-premium:hover { box-shadow: 0 0 20px rgba(102,126,234,0.4); }
.btn-next {
  padding: 12px; border-radius: 12px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  color: #777; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.btn-next:hover { border-color: rgba(255,255,255,0.25); color: #aaa; }

.topbar-host-btn {
  background: rgba(102,126,234,0.15);
  border: 1px solid rgba(102,126,234,0.3);
  color: #667eea; padding: 6px 16px;
  border-radius: 20px; font-size: 12px;
  cursor: pointer; letter-spacing: 1px;
  transition: all 0.2s; white-space: nowrap;
}
.topbar-host-btn:hover { background: rgba(102,126,234,0.25); }

@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

.main-content { flex: 1; display: flex; overflow: hidden; }

/* Street View */
.sv-side { flex: 1; position: relative; background: #000; }
#sv-iframe { width: 100%; height: 100%; border: none; display: block; }

.sv-loading {
  position: absolute; inset: 0;
  background: #0a0a14;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.5s;
}
.sv-loading.hidden { opacity: 0; pointer-events: none; }
.sv-spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,255,255,0.08);
  border-top-color: #667eea;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sv-loading p { font-size: 12px; color: #444; letter-spacing: 2px; }

.sv-overlay {
  position: absolute; bottom: 24px; left: 24px;
  background: rgba(10,10,15,0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 16px 20px;
  backdrop-filter: blur(12px); z-index: 10; min-width: 200px;
}
.sv-overlay .country { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.sv-overlay .coords { font-size: 11px; color: #555; font-family: monospace; }
.sv-overlay .local-time { font-size: 11px; color: #666; margin-top: 5px; }

/* ======= FULLSCREEN APP LAYOUT ======= */
.hud-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
}
/* PC: チャットパネル(320px)に右上のボタン(EN・Street View)が隠れないよう、パネルの左に寄せる */
@media (min-width: 641px) { #s-app:not(.chat-closed) .hud-top { right: 320px; } }
.hud-left { display: flex; align-items: center; gap: 8px; }
.hud-center { flex: 1; text-align: center; }
.hud-logo { font-size: 11px; letter-spacing: 6px; color: rgba(255,255,255,0.3); }
.hud-right { display: flex; align-items: center; gap: 8px; }

.hud-btn {
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  color: #aaa; padding: 6px 14px; border-radius: 20px;
  font-size: 11px; cursor: pointer; white-space: nowrap;
  transition: all 0.2s; backdrop-filter: blur(8px);
}
.hud-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
.hud-btn-primary {
  background: rgba(102,126,234,0.3);
  border-color: rgba(102,126,234,0.5); color: #a0b0ff;
}
.hud-btn-primary:hover { background: rgba(102,126,234,0.5); color: #fff; }

/* Chat panel — right side float */
.chat-panel {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 20;
  width: 320px;
  background: rgba(10,10,18,0.92);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.chat-panel.collapsed { transform: translateX(100%); }

.chat-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
  padding-top: 56px; /* clear top HUD */
}
.chat-toggle-btn {
  background: transparent; border: none; color: #444;
  font-size: 16px; cursor: pointer; margin-left: auto;
  transition: color 0.2s; line-height: 1;
}
.chat-toggle-btn:hover { color: #888; }

.chat-open-btn {
  position: absolute; bottom: 24px; right: 24px; z-index: 20;
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(102,126,234,0.9);
  border: none; cursor: pointer; font-size: 22px;
  box-shadow: 0 4px 20px rgba(102,126,234,0.4);
  transition: transform 0.2s;
}
.chat-open-btn:hover { transform: scale(1.08); }
.chat-open-btn.hidden { display: none; }

/* override sv-overlay position */
.sv-overlay { bottom: 24px; left: 24px; z-index: 10; }

/* ======= MOBILE DRAWER ======= */
@media (max-width: 640px) {
  * { max-width: 100%; box-sizing: border-box; }
  .hud-top { padding: 10px 12px; overflow: hidden; flex-wrap: wrap; }
  .hud-logo { display: none; }
  .hud-right { gap: 6px; }
  .hud-btn { font-size: 10px; padding: 5px 10px; }
  .timer-badge { font-size: 11px; padding: 4px 10px; }

  /* On mobile: chat panel becomes bottom drawer */
  .chat-panel {
    top: auto; right: 0; left: 0; bottom: 0;
    width: 100vw; max-width: 100vw; height: 38dvh; overflow-x: hidden;
    border-left: none;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px 20px 0 0;
    transform: translateY(calc(100% - 56px));
  }
  .chat-panel.open { transform: translateY(0); }

  /* キーボード表示時：入力欄を固定 */
  .chat-input-wrap {
    position: sticky;
    bottom: 0;
    background: #0d0d14;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .chat-panel-header {
    padding: 8px 16px 12px;
    cursor: pointer;
    position: relative;
  }
  .chat-panel-header::before {
    content: '';
    display: block;
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.2);
    margin: 0 auto 10px;
  }
  .chat-toggle-btn { display: none; }
  .chat-open-btn { display: none; }

  .sv-overlay { bottom: 88px; left: 12px; padding: 10px 14px; min-width: 150px; }
  .sv-overlay .country { font-size: 14px; }
  .next-door-btn { font-size: 11px; padding: 6px 12px; }
  .area-filter-btn { font-size: 11px; padding: 5px 10px; }
}

.next-door-wrap {
  position: absolute; top: 16px; left: 16px; z-index: 10;
  display: flex; flex-direction: column; gap: 8px;
}
.next-door-btn {
  background: rgba(10,10,15,0.85);
  border: 1px solid rgba(255,255,255,0.15);
  color: #aaa; padding: 8px 16px; border-radius: 20px;
  font-size: 12px; letter-spacing: 2px; cursor: pointer;
  text-transform: uppercase; transition: all 0.3s;
  backdrop-filter: blur(8px); white-space: nowrap;
}
.next-door-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

.area-filter { position: relative; }
.area-filter-btn {
  background: rgba(10,10,15,0.85);
  border: 1px solid rgba(255,255,255,0.1);
  color: #777; padding: 7px 14px; border-radius: 20px;
  font-size: 12px; cursor: pointer;
  backdrop-filter: blur(8px); transition: all 0.2s;
  white-space: nowrap;
}

/* Chat */

.chat-input-wrap {

.send-btn {

}

.send-btn svg { width: 14px; height: 14px; fill: #fff; }

.mic-btn {

  border: 1px solid rgba(255,255,255,0.12);

}

}

}

.speak-btn {

}

.typing-indicator { display: flex; align-items: center; gap: 4px; padding: 4px 6px; }

}

.survey-card h3 { margin:0 0 4px; font-size:16px; color:#fff; }
.survey-lead { margin:0 0 10px; color:#999; font-size:12px; }
.survey-card label { display:block; margin:10px 0 4px; font-size:12px; color:#bbb; }
.survey-card select, .survey-card textarea, .survey-card input[type=email] { width:100%; box-sizing:border-box; background:#0e1013; border:1px solid rgba(255,255,255,0.18); border-radius:8px; color:#eee; padding:8px; font-size:14px; font-family:inherit; }
.survey-card .survey-check { display:flex; gap:8px; align-items:flex-start; margin-top:12px; }
.survey-error { min-height:16px; color:#ff9a8a; font-size:12px; margin-top:6px; }
.survey-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
.survey-later, .survey-send { border-radius:18px; padding:8px 16px; font-size:13px; cursor:pointer; border:1px solid rgba(255,255,255,0.2); background:transparent; color:#ccc; }
.survey-send { background:#e3f09a; color:#111; border-color:#e3f09a; font-weight:600; }
.msg-label { display:block; font-size:10px; letter-spacing:.04em; margin-bottom:3px; color:#c9d97a; }
button.hud-btn { font-family:inherit; }
@media (max-width: 640px) {
  .chat-panel-header { touch-action: none; cursor: pointer; }
  /* Phone: give the street view most of the screen; keep the chat compact. */
  .chat-panel { height: 38dvh; bottom: var(--kb, 0px); }
  .hud-top { justify-content: flex-end; gap: 8px; }
  .hud-center { display: none; }
  .hud-right { order: 1; }
  .hud-left { order: 2; }
  #mapsLink { display: none; }
  .sv-overlay { transition: bottom .35s cubic-bezier(0.4,0,0.2,1); padding: 8px 12px; min-width: 0; }
  .sv-overlay .coords { display: none; }
  .sv-overlay .country { font-size: 13px; margin-bottom: 2px; }
  .sv-overlay .local-time { font-size: 10px; margin-top: 2px; }
  /* Phone: end the street view above the chat drawer so the move arrows are not covered,
     and drop the place label (the chat header already names the place). */
  #s-app.drawer-open #sv-iframe { bottom: calc(38dvh + var(--kb, 0px)) !important; height: auto !important; }
  #s-app.drawer-open .sv-overlay { display: none; }
  .chat-panel-header { padding: 4px 14px 6px; gap: 8px; }
  .chat-panel-header::before { margin-bottom: 6px; }
  .chat-panel .avatar { width: 28px; height: 28px; min-width: 28px; font-size: 14px; }
  .chat-name { font-size: 13px; }
  .chat-sub { font-size: 10px; margin-top: 0; }
  .messages { padding: 8px 12px; gap: 8px; }
  .msg-bubble { font-size: 12.5px; line-height: 1.5; padding: 7px 11px; }
  .msg.sys .msg-bubble { font-size: 11px; }
  .staff-row { padding: 1px 0 0; font-size: 10px; }
  /* Phone: top buttons share one size, so the row looks even (the move button keeps its tap size). */
  .hud-btn, .next-door-btn { font-size: 11px; padding: 0 12px; min-height: 32px; line-height: 32px; letter-spacing: 0.5px; text-transform: none; }
  .chat-actions { padding: 2px 12px 0; font-size: 10px; }
  .human-btn { padding: 3px 10px; font-size: 10px; }
  .chat-input-wrap { padding: 6px 12px max(8px, env(safe-area-inset-bottom)); }
  .chat-input { padding: 7px 12px; font-size: 16px; }
  .survey-card select, .survey-card textarea, .survey-card input[type=email] { font-size: 16px; }
  .send-btn { width: 30px; height: 30px; min-width: 30px; }
}
</style>
</head>
<body>

<div class="screen" id="s-landing">
  <div class="logo">Door Travel</div>
  <p data-i18n="tagline" style="font-size:13px;color:#555;letter-spacing:0.3px;margin-bottom:32px;">扉を開くと、日本のどこかへ。</p>
  <div class="door-wrap" id="doorWrap">
    <div class="door-outer">
      <div class="door-panel" id="doorPanel">
        <div class="door-knob"></div>
      </div>
      <div class="door-glow" id="doorGlow"></div>
    </div>
  </div>
  <button class="open-btn" data-i18n="open" onclick="openDoorAndLaunch()">扉を開く</button>
  <div class="legal-links">
    <a data-legal="privacy.html" href="privacy.html" target="_blank" rel="noopener" data-i18n="legalPrivacy">プライバシーポリシー</a>
    <a data-legal="terms.html" href="terms.html" target="_blank" rel="noopener" data-i18n="legalTerms">利用規約</a>
    <a data-legal="tokusho.html" href="tokusho.html" target="_blank" rel="noopener" data-i18n="legalTokusho">特定商取引法に基づく表記</a>
  </div>
</div>
<div class="screen gone" id="s-app" style="position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;">

  <!-- Street View fullscreen -->
  <iframe id="sv-iframe" style="position:absolute;inset:0;width:100%;height:100%;border:none;z-index:0;" title="ストリートビュー" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <!-- Loading -->
  <div class="sv-loading" id="svLoading" style="z-index:5;">
    <div class="sv-spinner"></div>
    <p data-i18n="loading">扉の向こうを覗いています...</p>
  </div>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-left">
      <button class="next-door-btn" data-i18n="move" onclick="goNext()">移動する →</button>
    </div>
    <div class="hud-center">
      <span class="hud-logo">DOOR TRAVEL</span>
    </div>
    <div class="hud-right">
      <div class="timer-badge" id="timerBadge" style="display:none;">⏱ 30:00</div>
      <button class="hud-btn" id="langBtn" onclick="toggleLang()">EN</button>
      <a class="hud-btn" id="mapsLink" target="_blank" rel="noopener">Street View ↗</a>
    </div>
  </div>

  <!-- Bottom location badge -->
  <div class="arrival" id="arrival" aria-hidden="true"><div class="arrival-name" id="arrivalName"></div><div class="arrival-sub" id="arrivalSub"></div></div>
  <div class="sv-overlay">
    <div class="country" id="overlayCountry">---</div>
    <div class="coords" id="overlayCoords">--</div>
    <div class="local-time" id="overlayTime">現地時刻: --:--</div>
  </div>

  <!-- Chat panel (right side on desktop, drawer on mobile) -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-panel-header">
      <div class="avatar" id="chatAvatar">🌍</div>
      <div style="flex:1;min-width:0;">
        <div class="chat-name" id="chatName">マッチング中...</div>
        <div class="chat-sub" id="chatSub">接続しています</div>
        <div class="staff-row"><span class="staff off" id="staffBadge"></span></div>
      </div>
      <button class="human-btn" id="humanBtn" onclick="toggleHuman()">人に聞く</button>
      <button class="chat-toggle-btn" onclick="toggleChat()" id="chatToggleBtn">✕</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-actions">
      <span class="quota" id="quota"></span>
    </div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chatInput" placeholder="日本やこの街について質問…" enterkeyhint="send" onkeydown="onChatKey(event)"/>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Chat open button (when panel is collapsed) -->
  <button class="chat-open-btn hidden" id="chatOpenBtn" onclick="toggleChat()">
    <span id="chatOpenAvatar">💬</span>
  </button>

</div>

<div class="survey hidden" id="survey" role="dialog" aria-modal="true">
  <div class="survey-card">
    <h3 data-i18n="surveyTitle">3つだけ教えてください</h3>
    <p class="survey-lead" data-i18n="surveyLead">Door Travelをよくするためのアンケートです。</p>
    <label data-i18n="surveyQ1">日本への旅行は？</label>
    <select id="svTrip">
      <option value="planning" data-i18n="trip_planning">これから行く予定</option>
      <option value="now" data-i18n="trip_now">今、日本にいる</option>
      <option value="past" data-i18n="trip_past">行ったことがある</option>
      <option value="none" data-i18n="trip_none">予定はない</option>
    </select>
    <label data-i18n="surveyQ2">旅行で一番困ること（自由記入）</label>
    <textarea id="svPain" rows="3" maxlength="1000"></textarea>
    <p class="survey-pass" data-i18n="surveyPass">7日パス（予定）：AIへの質問が1日100回まで、日本の担当者への質問が1日3回までできます。</p>
    <label data-i18n="surveyQ3">7日間980円なら使いたいですか？</label>
    <select id="svPay">
      <option value="yes" data-i18n="pay_yes">使いたい</option>
      <option value="maybe" data-i18n="pay_maybe">内容による</option>
      <option value="no" data-i18n="pay_no">使わない</option>
    </select>
    <label class="survey-check"><input id="svAndroid" type="checkbox" onchange="toggleSvEmail()"/> <span data-i18n="surveyAndroid">Android版のテストに協力する</span></label>
    <div id="svEmailWrap" class="sv-email hidden">
      <label data-i18n="surveyEmail">Googleアカウントのメール（Android版のテスト用）</label>
      <input id="svEmail" type="email" maxlength="200" autocomplete="email"/>
    </div>
    <p class="survey-legal"><span data-i18n="surveyConsent">送信すると、次の内容に同意したものとみなします：</span> <a data-legal="privacy.html" href="privacy.html" target="_blank" rel="noopener" data-i18n="legalPrivacy">プライバシーポリシー</a></p>
    <div class="survey-error" id="svError"></div>
    <div class="survey-actions">
      <button class="survey-later" onclick="closeSurvey()" data-i18n="surveyLater">あとで</button>
      <button class="survey-send" onclick="submitSurvey()" data-i18n="surveySend">送信</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
